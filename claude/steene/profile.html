<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | STEENE</title>
  <meta name="description" content="Manage your STEENE player profile, avatar, and match history.">

  <!-- Stylesheets[cite: 3] -->
  <link rel="stylesheet" href="css/host.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="steene-theme-dark">

  <header class="steene-navbar" id="steeneNavbar">
    <div class="nav-brand">
      <a href="../index.html"><span class="brand-logo">STEENE</span></a>
    </div>

    <nav class="nav-links">
      <a href="../index.html" class="nav-item" data-nav="dashboard">Games</a>
      <a href="profile.html" class="nav-item active" data-nav="profile">Profile</a>
      <a href="settings.html" class="nav-item" data-nav="settings">Settings</a>
    </nav>

    <div class="nav-actions">
      <button class="steene-btn btn-outline" id="btn-login" onclick="steeneAuth.openModal('login')">Log In</button>
      <button class="steene-btn btn-primary" id="btn-signup" onclick="steeneAuth.openModal('signup')">Sign Up</button>
      <button class="steene-btn btn-outline" id="btn-logout" style="display:none" onclick="steeneAuth.signOut()">Log Out</button>
    </div>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">☰</button>
  </header>

  <main id="steene-viewport" class="profile-page-shell">
    <section id="view-profile" class="steene-view active" aria-labelledby="profile-page-title">
      <div class="view-container profile-container-expanded">
          <div class="profile-card">
          
          <div id="profile-data" aria-live="polite">
            <div class="profile-card-inner">
              <p class="text-muted">Loading profile…</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="auth-modal" class="modal-overlay hidden">
    <!-- Existing Auth Modal Content from base[cite: 3] -->
    <div class="modal-content">
      <button class="modal-close" aria-label="Close" onclick="steeneAuth.closeModal()">×</button>
      <!-- Login/Signup Forms exactly as original -->
      <div id="login-form-container">
        <h2>Log In to STEENE</h2>
        <p class="auth-error" id="login-error"></p>
        <label>Email <input type="email" id="login-email"></label>
        <label>Password <input type="password" id="login-password"></label>
        <button class="steene-btn btn-primary" style="width:100%" onclick="steeneAuth.signIn()">Log In</button>
        <p class="auth-switch">Don't have an account? <a href="#" onclick="steeneAuth.switchModal('signup'); return false;">Sign Up</a></p>
      </div>
      <div id="signup-form-container" style="display:none">
        <h2>Create Your STEENE Account</h2>
        <p class="auth-error" id="signup-error"></p>
        <label>Display Name <input type="text" id="signup-username" maxlength="24"></label>
        <label>Email <input type="email" id="signup-email"></label>
        <label>Password <input type="password" id="signup-password"></label>
        <button class="steene-btn btn-primary" style="width:100%" onclick="steeneAuth.signUp()">Sign Up</button>
        <p class="auth-switch">Already have an account? <a href="#" onclick="steeneAuth.switchModal('login'); return false;">Log In</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth/auth-state.js"></script>
  <script src="js/auth/auth-ui.js"></script>
  <script src="js/audio/audio-manager.js"></script>
  <script src="js/components/navigation.js"></script>
  <script src="js/views/profile.js"></script>
</body>
</html>
