<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings | STEENE</title>

    <link rel="stylesheet" href="css/host.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="steene-theme-dark">

    <header class="steene-navbar" id="steeneNavbar">
        <div class="nav-brand">
            <a href="../index.html">
                <span class="brand-logo">STEENE</span>
            </a>
        </div>

        <nav class="nav-links" aria-label="Main navigation">
            <a
                href="../index.html"
                class="nav-item"
                data-nav="dashboard"
            >
                Games
            </a>

            <a
                href="profile.html"
                class="nav-item"
                data-nav="profile"
            >
                Profile
            </a>

            <a
                href="settings.html"
                class="nav-item active"
                data-nav="settings"
            >
                Settings
            </a>
        </nav>

        <div class="nav-actions">
            <button
                type="button"
                class="steene-btn btn-outline"
                id="btn-login"
                onclick="steeneAuth.openModal('login')"
            >
                Log In
            </button>

            <button
                type="button"
                class="steene-btn btn-primary"
                id="btn-signup"
                onclick="steeneAuth.openModal('signup')"
            >
                Sign Up
            </button>

            <button
                type="button"
                class="steene-btn btn-outline"
                id="btn-logout"
                style="display: none;"
                onclick="steeneAuth.signOut()"
            >
                Log Out
            </button>
        </div>

        <button
            type="button"
            class="mobile-menu-toggle"
            id="mobileMenuToggle"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
        >
            ☰
        </button>
    </header>

    <main id="steene-viewport">
        <section
            id="view-settings"
            class="steene-view active"
            aria-labelledby="settings-title"
        >
            <div class="view-container">
                <p class="dashboard-eyebrow">PREFERENCES</p>

                <h1 id="settings-title">
                    Settings
                </h1>

                <p class="text-muted">
                    Personalize your STEENE experience across the platform
                    and supported games.
                </p>

                <div id="settings-data"></div>
            </div>
        </section>
    </main>

    <div
        id="auth-modal"
        class="modal-overlay hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="auth-modal-title"
    >
        <div class="modal-content">
            <button
                type="button"
                class="modal-close"
                aria-label="Close"
                onclick="steeneAuth.closeModal()"
            >
                ×
            </button>

            <div id="login-form-container">
                <h2 id="auth-modal-title">Log In to STEENE</h2>

                <p class="auth-error" id="login-error"></p>

                <label for="login-email">
                    Email
                    <input
                        type="email"
                        id="login-email"
                        autocomplete="email"
                        placeholder="you@example.com"
                    >
                </label>

                <label for="login-password">
                    Password
                    <input
                        type="password"
                        id="login-password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                    >
                </label>

                <button
                    type="button"
                    class="steene-btn btn-primary"
                    style="width: 100%;"
                    onclick="steeneAuth.signIn()"
                >
                    Log In
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <a
                        href="#"
                        onclick="
                            steeneAuth.switchModal('signup');
                            return false;
                        "
                    >
                        Sign Up
                    </a>
                </p>
            </div>

            <div
                id="signup-form-container"
                style="display: none;"
            >
                <h2>Create Your STEENE Account</h2>

                <p class="auth-error" id="signup-error"></p>

                <label for="signup-username">
                    Display Name
                    <input
                        type="text"
                        id="signup-username"
                        autocomplete="nickname"
                        placeholder="Your name"
                        maxlength="24"
                    >
                </label>

                <label for="signup-email">
                    Email
                    <input
                        type="email"
                        id="signup-email"
                        autocomplete="email"
                        placeholder="you@example.com"
                    >
                </label>

                <label for="signup-password">
                    Password
                    <input
                        type="password"
                        id="signup-password"
                        autocomplete="new-password"
                        placeholder="At least 6 characters"
                    >
                </label>

                <button
                    type="button"
                    class="steene-btn btn-primary"
                    style="width: 100%;"
                    onclick="steeneAuth.signUp()"
                >
                    Sign Up
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <a
                        href="#"
                        onclick="
                            steeneAuth.switchModal('login');
                            return false;
                        "
                    >
                        Log In
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/auth/auth-state.js" defer></script>
    <script src="js/auth/auth-ui.js" defer></script>
    <script src="js/audio/audio-manager.js" defer></script>
    <script src="js/components/navigation.js" defer></script>
    <script src="js/views/settings.js" defer></script>
</body>
</html>
